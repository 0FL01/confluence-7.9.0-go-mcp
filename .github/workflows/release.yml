name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: confluence-mcp-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            printf '%s\n' 'Releases must be dispatched from main.' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf '%s\n' 'Version must be vMAJOR.MINOR.PATCH, without leading zeros or suffixes.' >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          install-only: true

      - name: Check release configuration
        run: goreleaser check

      - name: Run tests
        run: go test -v -cover ./...

      - name: Create and push release tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git tag "$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version }}
        run: goreleaser release --clean
